<div class="mist" aria-hidden="true"></div>

<div class="wind-layer" aria-hidden="true">
  <span class="streak streak--a"></span>
  <span class="streak streak--b"></span>
</div>

<div class="spring spring--back" aria-hidden="true"></div>
<div class="spring spring--front" aria-hidden="true"></div>
<div class="spring spring--catkin" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>春风</h1>
      <p>遇事不决，可问春风 · 五智能体协作推演</p>
    </div>
  </div>
  <div class="topbar-actions">
    <select class="mode-select" id="provider" title="运行模式">
      <option value="">自动</option>
      <option value="llm">真实模型</option>
      <option value="mock">预置剧本</option>
    </select>
    <span class="pill" id="mode-pill">未开始</span>
    <span class="pill pill--link" id="run-pill" hidden></span>
    <button class="ghost ghost--skip" id="skip-btn" type="button" title="跳过动画，直接显示结果">立即</button>
    <button class="ghost" id="history-btn" type="button">历史</button>
    <button class="ghost ghost--danger" id="stop-btn" type="button" hidden>停止推演</button>
    <button class="ghost" id="reset-btn" type="button">新推演</button>
  </div>
</header>

<div class="layout">
  <aside class="rail">
    <section class="rail-block">
      <h2>指挥席</h2>
      <ul class="seats" id="seats">
        <li data-seat="A1"><span class="lamp"></span><span class="seat-name">A1 背景探询</span><span class="seat-state">待命</span></li>
        <li data-seat="A2"><span class="lamp"></span><span class="seat-name">A2 支持方</span><span class="seat-state">待命</span></li>
        <li data-seat="A3"><span class="lamp"></span><span class="seat-name">A3 反对方</span><span class="seat-state">待命</span></li>
        <li data-seat="A4"><span class="lamp"></span><span class="seat-name">A4 量化测算</span><span class="seat-state">待命</span></li>
        <li data-seat="A5"><span class="lamp"></span><span class="seat-name">A5 仲裁汇总</span><span class="seat-state">待命</span></li>
      </ul>
    </section>

    <section class="rail-block">
      <h2>流转进度</h2>
      <ol class="phases" id="phases">
        <li><span class="tick"></span><em>入口</em></li>
        <li><span class="tick"></span><em>探询</em></li>
        <li><span class="tick"></span><em>并行</em></li>
        <li><span class="tick"></span><em>看板</em></li>
        <li><span class="tick"></span><em>交互</em></li>
        <li><span class="tick"></span><em>收尾</em></li>
      </ol>
    </section>

    <section class="rail-block rail-block--muted">
      <h2>指令速记</h2>
      <p><b>A</b> 质疑正方论据</p>
      <p><b>B</b> 质疑反方风险</p>
      <p><b>C</b> 修改财务参数</p>
      <p><b>D</b> 补充新背景</p>
      <p><b>E</b> 结束并出结论</p>
      <p><b>F</b> 停止推演（不出报告）</p>
      <p class="rail-note">说人话即可，路由是规则判定。</p>
    </section>
  </aside>

  <main class="stage">
    <div class="stream" id="stream" aria-live="polite"></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-hint" id="composer-hint"></div>
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="先说清你在纠结什么…"></textarea>
        <button class="send" id="send" type="submit">
          <span>发送</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h16M13 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="quick" id="quick" hidden></div>
    </form>
  </main>
</div>

<div class="drawer" id="history" hidden>
  <div class="drawer-head">
    <h2>历史场次</h2>
    <button class="ghost" id="history-close" type="button">关闭</button>
  </div>
  <div class="drawer-body" id="history-list"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
